<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Bibliothèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --paper:#EFEAD9;
    --card:#FAF7EE;
    --ink:#22304A;
    --ink-soft:#5B6478;
    --moss:#4F6A45;
    --moss-bg:#E1E8DA;
    --stamp:#A5382A;
    --brass:#A07A2E;
    --brass-bg:#F1E7CE;
    --line:#D2C9AE;
    --line-soft:#E3DCC6;
    --radius:10px;
    --shadow: 0 1px 2px rgba(34,48,74,0.08), 0 1px 1px rgba(34,48,74,0.06);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size:15px;
    line-height:1.4;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .serif{ font-family:"Source Serif 4", Georgia, serif; }
  .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    padding:calc(env(safe-area-inset-top) + 16px) 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .topbar h1{
    margin:0 0 2px;
    font-size:22px; font-weight:700; letter-spacing:0.2px;
    color:var(--ink);
  }
  .topbar .tagline{
    margin:0 0 12px; font-size:12px; color:var(--ink-soft);
    letter-spacing:0.4px; text-transform:uppercase;
  }
  .stats-row{
    display:flex; align-items:baseline; gap:14px; margin-bottom:8px;
  }
  .stat-num{ font-size:20px; font-weight:700; color:var(--brass); font-family:"Source Serif 4", Georgia, serif; }
  .stat-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px; }
  .stat{ display:flex; flex-direction:column; gap:1px; }
  .progress-track{
    height:6px; background:var(--line-soft); border-radius:4px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--moss); border-radius:4px;
    transition:width .4s ease;
  }

  /* ---------- Actions ---------- */
  .actions{
    display:flex; gap:10px; padding:14px 18px 6px;
  }
  .btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:12px 10px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:14px; font-weight:600;
    box-shadow:var(--shadow);
  }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--ink); color:var(--card); border-color:var(--ink); }
  .btn svg{ width:17px; height:17px; flex-shrink:0; }

  /* ---------- Filters ---------- */
  .filters{
    padding:10px 18px 4px; display:flex; flex-direction:column; gap:10px;
  }
  .search-wrap{ position:relative; }
  .search-wrap input{
    width:100%; padding:10px 12px 10px 34px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); font-size:14px; color:var(--ink);
  }
  .search-wrap input::placeholder{ color:var(--ink-soft); }
  .search-wrap svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--ink-soft);
  }
  .chips-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    padding:6px 11px; border-radius:20px; border:1px solid var(--line);
    background:transparent; font-size:12px; color:var(--ink-soft); font-weight:600; white-space:nowrap;
  }
  .chip.active{ background:var(--ink); color:var(--card); border-color:var(--ink); }
  .sort-select{
    padding:6px 10px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); font-size:12px; color:var(--ink-soft); font-weight:600; font-family:inherit;
  }

  /* ---------- List ---------- */
  #book-list{ padding:12px 18px 40px; display:flex; flex-direction:column; gap:10px; }
  .row{
    display:flex; gap:12px; padding:10px; background:var(--card);
    border-radius:var(--radius); border:1px solid var(--line-soft);
    border-left:4px solid var(--ink-soft);
    position:relative;
  }
  .row.is-read{ border-left-color:var(--moss); }
  .row.is-reading{ border-left-color:var(--brass); }
  .cover{
    width:44px; height:64px; border-radius:4px; flex-shrink:0; overflow:hidden;
    background:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    color:var(--card); font-family:"Source Serif 4", Georgia, serif; font-weight:600; font-size:18px;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .row-info{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .row-title{ font-family:"Source Serif 4", Georgia, serif; font-weight:600; font-size:15px; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .row-author{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-isbn{ font-size:10.5px; color:var(--ink-soft); opacity:0.7; margin-top:1px; }
  .row-actions{ display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:6px; }
  .tag-btn{
    font-size:10.5px; font-weight:700; letter-spacing:0.4px; padding:4px 9px; border-radius:20px;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft); white-space:nowrap;
  }
  .tag-btn.read{ background:var(--moss-bg); color:var(--moss); border-color:var(--moss-bg); }
  .tag-btn.reading{ background:var(--brass-bg); color:var(--brass); border-color:var(--brass-bg); }
  .loan-badge{
    display:inline-block; margin-top:3px; font-size:10.5px; font-weight:700; letter-spacing:0.3px;
    color:var(--brass); background:var(--brass-bg); padding:2px 8px; border-radius:10px; width:fit-content;
  }
  .row-actions-icons{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    border:none; background:none; color:var(--ink-soft); padding:4px; opacity:0.55;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .del-btn.confirm{ color:var(--stamp); opacity:1; font-size:10.5px; font-weight:700; white-space:nowrap; }

  .empty{
    text-align:center; padding:50px 24px; color:var(--ink-soft);
  }
  .empty .serif{ font-size:18px; color:var(--ink); display:block; margin-bottom:6px; }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; background:var(--paper); z-index:100;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .overlay[hidden]{ display:none; }
  .overlay-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .overlay-head h2{ margin:0; font-size:16px; font-family:"Source Serif 4", Georgia, serif; }
  .close-btn{ border:none; background:none; color:var(--ink); font-size:22px; line-height:1; padding:4px 8px; }
  .overlay-body{ flex:1; overflow-y:auto; padding:18px; }

  /* Scanner */
  #scanner-viewport{
    position:relative; width:100%; height:52vh; background:#0d1420; border-radius:14px; overflow:hidden;
  }
  #scanner-viewport video, #scanner-viewport canvas{
    position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;
  }
  .viewfinder{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:78%; height:96px; border:2px solid var(--brass); border-radius:8px;
    box-shadow:0 0 0 2000px rgba(8,12,20,0.55); pointer-events:none;
  }
  .scan-hint{ text-align:center; margin-top:14px; color:var(--ink-soft); font-size:13px; }
  .scan-status{ text-align:center; margin-top:6px; font-size:12px; color:var(--stamp); min-height:16px; }

  /* Result card inside scanner overlay */
  .result-card{
    margin-top:16px; background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--radius); padding:16px; display:flex; gap:14px;
  }
  .result-card .cover{ width:60px; height:88px; font-size:22px; }
  .result-fields{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .field-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); margin-bottom:2px; display:block; }
  .field-input{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--paper);
    font-size:13.5px; color:var(--ink);
  }
  .result-actions{ display:flex; gap:10px; margin-top:14px; }
  .read-toggle-row{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .read-switch{
    display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; width:fit-content;
  }
  .read-switch button{
    border:none; background:var(--paper); padding:6px 11px; font-size:11.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
  }
  .read-switch button.active{ background:var(--moss); color:#fff; }
  .read-switch button.active[data-val="reading"]{ background:var(--brass); }

  /* Stamp */
  .stamp-wrap{ display:flex; flex-direction:column; align-items:center; padding:30px 10px 10px; }
  .stamp{
    border:3px solid var(--stamp); color:var(--stamp); border-radius:10px;
    padding:14px 22px; transform:rotate(-6deg); font-weight:700; font-size:15px;
    letter-spacing:1.5px; text-transform:uppercase; text-align:center;
    box-shadow: inset 0 0 0 2px rgba(165,56,42,0.15);
  }
  @media (prefers-reduced-motion:no-preference){
    .stamp{ animation: thump .28s ease-out; }
  }
  @keyframes thump{
    0%{ transform:rotate(-6deg) scale(0.6); opacity:0; }
    70%{ transform:rotate(-6deg) scale(1.08); opacity:1; }
    100%{ transform:rotate(-6deg) scale(1); }
  }
  .stamp-book{ margin-top:20px; display:flex; gap:12px; align-items:center; }
  .stamp-book .row-title{ -webkit-line-clamp:2; }

  /* Manual form */
  .form-field{ margin-bottom:14px; }
  .form-field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .form-field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-size:14.5px; color:var(--ink);
  }

  /* Autocomplete */
  .ac-dropdown{
    position:absolute; left:0; right:0; top:100%; margin-top:4px;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    box-shadow:var(--shadow); max-height:260px; overflow-y:auto; z-index:50;
    -webkit-overflow-scrolling:touch;
  }
  .ac-dropdown[hidden]{ display:none; }
  .ac-item{
    display:flex; gap:10px; padding:8px 10px; align-items:center;
    border-bottom:1px solid var(--line-soft);
  }
  .ac-item:last-child{ border-bottom:none; }
  .ac-item:active{ background:var(--paper); }
  .ac-item .cover{ font-size:12px; flex-shrink:0; }
  .ac-item-info{ min-width:0; flex:1; }
  .ac-item-title{ font-size:13px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-item-author{ font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-empty{ padding:10px 12px; font-size:12.5px; color:var(--ink-soft); }

  /* Series grouping */
  .series-card{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden;
  }
  .series-header{
    width:100%; display:flex; align-items:center; gap:10px; padding:13px 12px;
    border:none; background:none; text-align:left;
  }
  .series-chevron{
    color:var(--brass); font-size:12px; flex-shrink:0; width:12px; display:inline-block;
    transition:transform .2s ease;
  }
  .series-chevron.open{ transform:rotate(90deg); }
  .series-name{ font-weight:600; font-size:14.5px; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .series-meta{ font-size:11px; color:var(--brass); flex-shrink:0; font-weight:700; white-space:nowrap; }
  .series-books{
    padding:0 10px 10px; display:flex; flex-direction:column; gap:8px;
    border-top:1px solid var(--line-soft); padding-top:10px; margin-top:-2px;
  }
  .series-books .row{ border-left-width:3px; }

  /* Toast */
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--card); padding:10px 18px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:200; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .footer-link{
    display:block; text-align:center; padding:6px 0 30px; font-size:12px; color:var(--ink-soft); text-decoration:underline;
    background:none; border:none; width:100%;
  }
  .camera-error{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px; }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="serif">Ma Bibliothèque</h1>
  <p class="tagline">Catalogue personnel</p>
  <div class="stats-row">
    <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Livres</span></div>
    <div class="stat"><span class="stat-num" id="stat-read">0</span><span class="stat-label">Lus</span></div>
    <div class="stat"><span class="stat-num" id="stat-pct">0%</span><span class="stat-label">Progression</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</header>

<div class="actions">
  <button class="btn primary" id="open-scanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 6v12M11 6v12M15 6v12"/></svg>
    Scanner
  </button>
  <button class="btn" id="open-manual">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Ajouter
  </button>
</div>

<div class="filters">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input type="text" id="search" placeholder="Rechercher un titre ou un auteur…">
  </div>
  <div class="chips-row">
    <div class="chips">
      <button class="chip active" data-filter="all">Tous</button>
      <button class="chip" data-filter="unread">À lire</button>
      <button class="chip" data-filter="reading">En cours</button>
      <button class="chip" data-filter="read">Lus</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="recent">Plus récents</option>
      <option value="title">Titre A→Z</option>
      <option value="author">Auteur A→Z</option>
    </select>
  </div>
</div>

<div id="book-list"></div>

<button class="footer-link" id="export-btn">Exporter ma bibliothèque (sauvegarde JSON)</button>

<!-- Scanner overlay -->
<div class="overlay" id="scanner-overlay" hidden>
  <div class="overlay-head">
    <h2 class="serif">Scanner un livre</h2>
    <button class="close-btn" id="close-scanner">&times;</button>
  </div>
  <div class="overlay-body">
    <div id="scanner-viewport">
      <div class="viewfinder" id="viewfinder"></div>
    </div>
    <p class="scan-hint" id="scan-hint">Vise le code-barres au dos du livre.</p>
    <p class="scan-status" id="scan-status"></p>
    <div id="scan-result"></div>
  </div>
</div>

<!-- Manual add overlay -->
<div class="overlay" id="manual-overlay" hidden>
  <div class="overlay-head">
    <h2 class="serif" id="manual-overlay-title">Ajouter manuellement</h2>
    <button class="close-btn" id="close-manual">&times;</button>
  </div>
  <div class="overlay-body">
    <div class="form-field">
      <label for="m-title">Titre</label>
      <input type="text" id="m-title" placeholder="Le Nom du vent">
    </div>
    <div class="form-field">
      <label for="m-author">Auteur</label>
      <input type="text" id="m-author" placeholder="Patrick Rothfuss">
    </div>
    <div class="form-field">
      <label for="m-series">Série (optionnel)</label>
      <input type="text" id="m-series" placeholder="Ex: Harry Potter">
    </div>
    <div class="form-field">
      <label for="m-isbn">ISBN (optionnel)</label>
      <input type="text" id="m-isbn" placeholder="978-2-...">
    </div>
    <div class="form-field">
      <label>Statut de lecture</label>
      <div class="read-switch" id="m-read-switch">
        <button type="button" data-val="unread" class="active">Non lu</button>
        <button type="button" data-val="reading">En cours</button>
        <button type="button" data-val="read">Lu</button>
      </div>
    </div>
    <div class="form-field">
      <label for="m-loan">Prêté à (optionnel)</label>
      <input type="text" id="m-loan" placeholder="Laisse vide si le livre est chez toi">
    </div>
    <button class="btn primary" id="m-save" style="width:100%; margin-top:6px;">Ajouter à ma bibliothèque</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var API_URL = "/api/library";
  // Si tu as protégé la fonction avec la variable d'environnement LIBRARY_API_KEY
  // côté Netlify, mets la même valeur ici pour que l'app puisse s'authentifier.
  var API_KEY = "";

  var books = [];
  var filterState = "all";
  var searchState = "";
  var sortState = "recent";
  var quaggaRunning = false;
  var pendingManualStatus = "unread";
  var lastCodes = [];
  var expandedSeries = new Set();
  var manualSelectedCover = "";
  var editingBook = null;

  function apiHeaders(json){
    var h = {};
    if (json) h["Content-Type"] = "application/json";
    if (API_KEY) h["x-api-key"] = API_KEY;
    return h;
  }

  // ---------- Storage (Netlify Function + Netlify Blobs) ----------
  function loadLibrary(){
    fetch(API_URL, { headers: apiHeaders(false) })
      .then(function(r){
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function(data){
        books = Array.isArray(data) ? data : [];
        books.forEach(function(b){
          if (!b.status) b.status = b.read ? "read" : "unread";
          if (typeof b.loanedTo !== "string") b.loanedTo = "";
          if (typeof b.series !== "string") b.series = "";
        });
        renderAll();
      })
      .catch(function(){
        books = [];
        renderAll();
        showToast("Impossible de charger tes données. Vérifie ta connexion.");
      });
  }

  function saveLibrary(){
    return fetch(API_URL, {
      method: "POST",
      headers: apiHeaders(true),
      body: JSON.stringify(books)
    }).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
    }).catch(function(){
      showToast("Erreur d'enregistrement — réessaie.");
    });
  }

  // ---------- Rendering ----------
  function renderAll(){ renderStats(); renderList(); }

  function renderStats(){
    var total = books.length;
    var read = books.filter(function(b){ return b.status === "read"; }).length;
    var pct = total ? Math.round((read/total)*100) : 0;
    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-read").textContent = read;
    document.getElementById("stat-pct").textContent = pct + "%";
    document.getElementById("progress-fill").style.width = pct + "%";
  }

  function initials(title){
    return (title || "?").trim().charAt(0).toUpperCase() || "?";
  }

  function coverEl(book, size){
    var wrap = document.createElement("div");
    wrap.className = "cover";
    if (size) { wrap.style.width = size + "px"; wrap.style.height = Math.round(size*1.45) + "px"; }
    if (book.cover){
      var img = document.createElement("img");
      img.src = book.cover;
      img.alt = "";
      img.onerror = function(){ img.remove(); wrap.textContent = initials(book.title); };
      wrap.appendChild(img);
    } else {
      wrap.textContent = initials(book.title);
    }
    return wrap;
  }

  function statusLabel(status){
    if (status === "reading") return "EN COURS";
    if (status === "read") return "LU";
    return "NON LU";
  }
  function statusClass(status){
    if (status === "reading") return " reading";
    if (status === "read") return " read";
    return "";
  }
  function nextStatus(status){
    if (status === "unread") return "reading";
    if (status === "reading") return "read";
    return "unread";
  }
  function rowStatusClass(status){
    if (status === "read") return " is-read";
    if (status === "reading") return " is-reading";
    return "";
  }

  function makeRow(book, opts){
    opts = opts || {};
    var row = document.createElement("div");
    row.className = "row" + rowStatusClass(book.status);
    row.appendChild(coverEl(book));

    var info = document.createElement("div");
    info.className = "row-info";

    info.appendChild(t); info.appendChild(a);

    }
    if (book.loanedTo){
      var loanEl = document.createElement("div"); loanEl.className = "loan-badge"; loanEl.textContent = "Prêté à " + book.loanedTo;
      info.appendChild(loanEl);
    }
    row.appendChild(info);

    var actions = document.createElement("div");
    actions.className = "row-actions";
    var tag = document.createElement("button");
    tag.className = "tag-btn" + statusClass(book.status);
    tag.textContent = statusLabel(book.status);
    tag.addEventListener("click", function(){
      book.status = nextStatus(book.status);
      saveLibrary();
      renderAll();
    });
    var edit = document.createElement("button");
    edit.className = "icon-btn edit-btn";
    edit.setAttribute("aria-label", "Modifier");
    edit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    edit.addEventListener("click", function(){
      openEditOverlay(book);
    });
    var del = document.createElement("button");
    del.className = "icon-btn del-btn";
    del.setAttribute("aria-label", "Supprimer");
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
    var confirmingDelete = false;
    del.addEventListener("click", function(){
      if (!confirmingDelete){
        confirmingDelete = true;
        del.classList.add("confirm");
        del.textContent = "Supprimer ?";
        setTimeout(function(){
          confirmingDelete = false;
          del.classList.remove("confirm");
          del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
        }, 2500);
        return;
      }
      books = books.filter(function(b){ return b !== book; });
      saveLibrary();
      renderAll();
      showToast("Livre supprimé.");
    });
    var iconRow = document.createElement("div");
    iconRow.className = "row-actions-icons";
    iconRow.appendChild(edit);
    iconRow.appendChild(del);
    actions.appendChild(tag);
    actions.appendChild(iconRow);
    row.appendChild(actions);
    return row;
  }

  var MIN_PREFIX_WORDS = 2;

  function tokenizeTitle(title){
    return (title || "")
      .trim()
      .split(/\s+/)
      .map(function(w){ return w.replace(/^[:\-–—,;.'"]+|[:\-–—,;.'"]+$/g, ""); })
      .filter(function(w){ return w.length > 0; });
  }

  function commonPrefixLen(tokensA, tokensB){
    var n = Math.min(tokensA.length, tokensB.length);
    var i = 0;
    while (i < n && normalizeForMatch(tokensA[i]) === normalizeForMatch(tokensB[i])) i++;
    return i;
  }

  function deriveSub(tokens, prefixLen, fallbackTitle){
    var rest = tokens.slice(prefixLen).join(" ").trim();
    return rest || fallbackTitle;
  }

  // Regroupe les livres en séries : priorité au champ "Série" explicite,
  // puis détection automatique par préfixe de mots commun (au sein d'un même auteur).
  // Ça permet de regrouper "Harry Potter à l'école des sorciers" et "Harry Potter
  // et la Chambre des secrets" même sans ":" dans le titre.
  function buildSeriesEntries(filtered){
    var explicitBuckets = {};
    var noExplicit = [];

    filtered.forEach(function(book){
      if (book.series && book.series.trim()){
        var key = normalizeForMatch(book.series);
        if (!explicitBuckets[key]){
          explicitBuckets[key] = { label: book.series.trim(), prefixTokens: tokenizeTitle(book.series), items: [] };
        }
        explicitBuckets[key].items.push(book);
      } else {
        noExplicit.push(book);
      }
    });

    // Un livre non tagué qui commence par le nom d'une série déjà taguée la rejoint.
    var stillUnassigned = [];
    noExplicit.forEach(function(book){
      var tokens = tokenizeTitle(book.title);
      var matched = null;
      Object.keys(explicitBuckets).forEach(function(key){
        if (matched) return;
        var bucket = explicitBuckets[key];
        var len = commonPrefixLen(tokens, bucket.prefixTokens);
        if (bucket.prefixTokens.length && len >= bucket.prefixTokens.length) matched = bucket;
      });
      if (matched) matched.items.push(book);
      else stillUnassigned.push(book);
    });

    // Le reste : clustering par préfixe de mots commun, au sein d'un même auteur.
    var byAuthor = {};
    stillUnassigned.forEach(function(book){
      var a = normalizeForMatch(book.author || "");
      if (!byAuthor[a]) byAuthor[a] = [];
      byAuthor[a].push(book);
    });

    var autoClusters = [];
    var standalone = [];
    Object.keys(byAuthor).forEach(function(a){
      var list = byAuthor[a].slice().sort(function(x,y){ return (x.addedAt||0) - (y.addedAt||0); });
      var clusters = [];
      list.forEach(function(book){
        var tokens = tokenizeTitle(book.title);
        var best = null, bestLen = 0;
        clusters.forEach(function(c){
          var len = commonPrefixLen(tokens, c.prefixTokens);
          if (len >= MIN_PREFIX_WORDS && len > bestLen){ bestLen = len; best = c; }
        });
        if (best){
          best.prefixTokens = best.prefixTokens.slice(0, bestLen);
          best.items.push(book);
        } else {
          clusters.push({ prefixTokens: tokens.slice(), items: [book] });
        }
      });
      clusters.forEach(function(c){
        if (c.items.length >= 2) autoClusters.push(c);
        else standalone.push(c.items[0]);
      });
    });

    var entries = [];
    Object.keys(explicitBuckets).forEach(function(key){
      var bucket = explicitBuckets[key];
      if (bucket.items.length >= 2){
        var maxAdded1 = 0;
        var items1 = bucket.items.map(function(book){
          maxAdded1 = Math.max(maxAdded1, book.addedAt || 0);
          var tokens = tokenizeTitle(book.title);
          var len = commonPrefixLen(tokens, bucket.prefixTokens) >= bucket.prefixTokens.length ? bucket.prefixTokens.length : 0;
          return { book: book, sub: len ? deriveSub(tokens, len, book.title) : book.title };
        });
        entries.push({ type: "series", key: "e:" + key, label: bucket.label, items: items1, sortKey: maxAdded1 });
      } else if (bucket.items.length === 1){
        standalone.push(bucket.items[0]);
      }
    });
    autoClusters.forEach(function(c, idx){
      var maxAdded2 = 0;
      var label = c.prefixTokens.join(" ");
      var items2 = c.items.map(function(book){
        maxAdded2 = Math.max(maxAdded2, book.addedAt || 0);
        var tokens = tokenizeTitle(book.title);
        return { book: book, sub: deriveSub(tokens, c.prefixTokens.length, book.title) };
      });
      entries.push({ type: "series", key: "a:" + normalizeForMatch(label) + ":" + idx, label: label, items: items2, sortKey: maxAdded2 });
    });
    standalone.forEach(function(book){
      entries.push({ type: "book", book: book, sortKey: book.addedAt || 0 });
    });

    return entries;
  }

  // Normalise pour la comparaison uniquement (pas pour l'affichage) : les claviers
  // mobiles remplacent souvent l'apostrophe droite par une apostrophe typographique,
  // ce qui empêche deux titres de la même série de se regrouper.
  function normalizeForMatch(s){
    return (s || "")
      .toLowerCase()
      .replace(/[’‘`´]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/\s+/g, " ")
      .trim();
  }

  function makeSeriesCard(entry){
    var card = document.createElement("div");
    card.className = "series-card";
    var readCount = entry.items.filter(function(it){ return it.book.status === "read"; }).length;
    var isOpen = expandedSeries.has(entry.key);

    var header = document.createElement("button");
    header.type = "button";
    header.className = "series-header";
    var chevron = document.createElement("span");
    chevron.className = "series-chevron" + (isOpen ? " open" : "");
    chevron.textContent = "▸";
    var name = document.createElement("span");
    name.className = "series-name serif";
    name.textContent = entry.label;
    var meta = document.createElement("span");
    meta.className = "series-meta";
    meta.textContent = entry.items.length + " tomes · " + readCount + " lu" + (readCount > 1 ? "s" : "");
    header.appendChild(chevron); header.appendChild(name); header.appendChild(meta);
    header.addEventListener("click", function(){
      if (expandedSeries.has(entry.key)) expandedSeries.delete(entry.key);
      else expandedSeries.add(entry.key);
      renderList();
    });
    card.appendChild(header);

    if (isOpen){
      var body = document.createElement("div");
      body.className = "series-books";
      entry.items
        .slice()
        .sort(function(a,b){ return (a.sub||"").localeCompare(b.sub||""); })
        .forEach(function(it){ body.appendChild(makeRow(it.book, { titleOverride: it.sub })); });
      card.appendChild(body);
    }
    return card;
  }

  function renderGrouped(list, filtered){
    var entries = buildSeriesEntries(filtered);
    entries.forEach(function(entry){
      if (entry.type === "book"){
        entry.sortTitle = entry.book.title || "";
        entry.sortAuthor = entry.book.author || "";
      } else {
        entry.sortTitle = entry.label || "";
        entry.sortAuthor = (entry.items[0] && entry.items[0].book.author) || "";
      }
    });
    entries.sort(compareEntries);

    entries.forEach(function(entry){
      list.appendChild(entry.type === "book" ? makeRow(entry.book) : makeSeriesCard(entry));
    });
  }

  function compareEntries(a, b){
    if (sortState === "title"){
      return a.sortTitle.localeCompare(b.sortTitle, "fr", { sensitivity: "base" });
    }
    if (sortState === "author"){
      var cmp = a.sortAuthor.localeCompare(b.sortAuthor, "fr", { sensitivity: "base" });
      return cmp !== 0 ? cmp : a.sortTitle.localeCompare(b.sortTitle, "fr", { sensitivity: "base" });
    }
    return b.sortKey - a.sortKey;
  }

  function renderList(){
    var list = document.getElementById("book-list");
    list.innerHTML = "";
    var filtered = books.filter(function(b){
      if (filterState === "read" && b.status !== "read") return false;
      if (filterState === "unread" && b.status !== "unread") return false;
      if (filterState === "reading" && b.status !== "reading") return false;
      if (searchState){
        var hay = ((b.title||"") + " " + (b.author||"") + " " + (b.loanedTo||"")).toLowerCase();
        if (hay.indexOf(searchState) === -1) return false;
      }
      return true;
    }).sort(function(a,b){
      if (sortState === "title") return (a.title||"").localeCompare(b.title||"", "fr", { sensitivity: "base" });
      if (sortState === "author"){
        var cmp = (a.author||"").localeCompare(b.author||"", "fr", { sensitivity: "base" });
        return cmp !== 0 ? cmp : (a.title||"").localeCompare(b.title||"", "fr", { sensitivity: "base" });
      }
      return (b.addedAt||0) - (a.addedAt||0);
    });

    if (!books.length){
      list.innerHTML = '<div class="empty"><span class="serif">Ta bibliothèque est vide</span>Scanne ou ajoute ton premier livre pour commencer ton catalogue.</div>';
      return;
    }
    if (!filtered.length){
      list.innerHTML = '<div class="empty">Aucun livre ne correspond à ta recherche.</div>';
      return;
    }

    var canGroup = (filterState === "all" && !searchState);
    if (canGroup){
      renderGrouped(list, filtered);
    } else {
      filtered.forEach(function(book){ list.appendChild(makeRow(book)); });
    }
  }

  // ---------- Toast ----------
  var toastTimer;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  // ---------- Filters / search ----------
  document.querySelectorAll(".chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
      filterState = chip.getAttribute("data-filter");
      renderList();
    });
  });
  document.getElementById("sort-select").addEventListener("change", function(e){
    sortState = e.target.value;
    renderList();
  });
  document.getElementById("search").addEventListener("input", function(e){
    searchState = e.target.value.trim().toLowerCase();
    renderList();
  });

  // ---------- Book lookup ----------
  function normalizeIsbn(code){ return (code || "").replace(/[^0-9Xx]/g, ""); }

  // Certaines fiches (Google Books notamment) séparent le titre de la série
  // et le sous-titre du tome en deux champs distincts. On les recombine ici
  // pour obtenir "Série : sous-titre", cohérent avec le regroupement par série.
  function combineTitle(title, subtitle){
    title = (title || "").trim();
    subtitle = (subtitle || "").trim();
    if (!subtitle) return title;
    if (!title) return subtitle;
    if (title.toLowerCase().indexOf(subtitle.toLowerCase()) !== -1) return title;
    return title + ": " + subtitle;
  }

  function lookupBook(isbn){
    return fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.totalItems > 0){
          var info = data.items[0].volumeInfo || {};
          var cover = "";
          if (info.imageLinks) cover = (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || "").replace("http://","https://");
          return {
            title: combineTitle(info.title, info.subtitle),
            author: (info.authors || []).join(", "),
            cover: cover
          };
        }
        throw new Error("not found in google books");
      })
      .catch(function(){
        return fetch("https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data")
          .then(function(r){ return r.json(); })
          .then(function(data){
            var key = "ISBN:" + isbn;
            if (data && data[key]){
              var b = data[key];
              return {
                title: combineTitle(b.title, b.subtitle),
                author: (b.authors || []).map(function(a){ return a.name; }).join(", "),
                cover: b.cover ? (b.cover.medium || b.cover.small || "") : ""
              };
            }
            return null;
          })
          .catch(function(){ return null; });
      });
  }

  // ---------- Scanner overlay ----------
  var scannerOverlay = document.getElementById("scanner-overlay");
  var scanResultEl = document.getElementById("scan-result");
  var scanStatusEl = document.getElementById("scan-status");
  var scanHintEl = document.getElementById("scan-hint");

  document.getElementById("open-scanner").addEventListener("click", function(){
    scannerOverlay.hidden = false;
    scanResultEl.innerHTML = "";
    scanStatusEl.textContent = "";
    scanHintEl.style.display = "block";
    lastCodes = [];
    startScanner();
  });
  document.getElementById("close-scanner").addEventListener("click", function(){
    stopScanner();
    scannerOverlay.hidden = true;
  });

  function startScanner(){
    if (typeof Quagga === "undefined"){
      document.getElementById("scanner-viewport").innerHTML =
        '<div class="camera-error">Le scanner n\'a pas pu se charger.<br>Utilise l\'ajout manuel à la place.</div>';
      return;
    }
    var viewport = document.getElementById("scanner-viewport");
    Quagga.init({
      inputStream: {
        type: "LiveStream",
        target: viewport,
        constraints: { facingMode: "environment", width: { ideal: 720 }, height: { ideal: 480 } }
      },
      locate: true,
      decoder: { readers: ["ean_reader"] },
      locator: { patchSize: "medium", halfSample: true }
    }, function(err){
      if (err){
        viewport.innerHTML = '<div class="camera-error">Impossible d\'accéder à la caméra.<br>Vérifie les autorisations, ou utilise l\'ajout manuel.</div>';
        return;
      }
      // re-attach viewfinder (Quagga clears the target's innerHTML)
      var vf = document.createElement("div");
      vf.className = "viewfinder";
      viewport.appendChild(vf);
      Quagga.start();
      quaggaRunning = true;
    });
    Quagga.onDetected(onBarcodeDetected);
  }

  // ---------- Autocomplétion (suggestions pendant la saisie du titre) ----------
  function mapGoogleItems(data){
    if (!data || !data.items) return [];
    return data.items.map(function(item){
      var info = item.volumeInfo || {};
      var isbn = "";
      if (info.industryIdentifiers){
        var pick = info.industryIdentifiers.find(function(x){ return x.type === "ISBN_13"; }) ||
                   info.industryIdentifiers.find(function(x){ return x.type === "ISBN_10"; });
        if (pick) isbn = pick.identifier;
      }
      var cover = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || "").replace("http://","https://") : "";
      return {
        title: combineTitle(info.title, info.subtitle),
        author: (info.authors || []).join(", "),
        isbn: normalizeIsbn(isbn),
        cover: cover
      };
    }).filter(function(b){ return b.title; });
  }

  function mapOpenLibraryDocs(data){
    if (!data || !data.docs) return [];
    return data.docs.map(function(d){
      var cover = d.cover_i ? ("https://covers.openlibrary.org/b/id/" + d.cover_i + "-M.jpg") : "";
      var isbn = (d.isbn && d.isbn.length) ? d.isbn[0] : "";
      return {
        title: combineTitle(d.title, d.subtitle),
        author: (d.author_name || []).join(", "),
        isbn: normalizeIsbn(isbn),
        cover: cover
      };
    }).filter(function(b){ return b.title; });
  }

  function searchBookSuggestions(query){
    return fetch("https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(query) + "&maxResults=5")
      .then(function(r){ if (!r.ok) throw new Error("google_http_" + r.status); return r.json(); })
      .then(mapGoogleItems)
      .catch(function(){
        return fetch("https://openlibrary.org/search.json?q=" + encodeURIComponent(query) + "&limit=5")
          .then(function(r){ if (!r.ok) throw new Error("ol_http_" + r.status); return r.json(); })
          .then(mapOpenLibraryDocs);
      });
  }

  function attachAutocomplete(inputEl, onSelect){
    var parent = inputEl.parentNode;
    parent.style.position = "relative";
    var dropdown = document.createElement("div");
    dropdown.className = "ac-dropdown";
    dropdown.hidden = true;
    parent.appendChild(dropdown);

    var debounceTimer = null;
    var currentQuery = "";

    inputEl.addEventListener("input", function(){
      var q = inputEl.value.trim();
      currentQuery = q;
      clearTimeout(debounceTimer);
      if (q.length < 3){
        dropdown.hidden = true;
        dropdown.innerHTML = "";
        return;
      }
      renderMessage("Recherche…");
      debounceTimer = setTimeout(function(){
        searchBookSuggestions(q).then(function(results){
          if (currentQuery !== q) return;
          if (!results.length){ renderMessage("Aucun résultat trouvé."); return; }
          renderDropdown(results);
        }).catch(function(){
          if (currentQuery !== q) return;
          renderMessage("Recherche indisponible pour l'instant.");
        });
      }, 400);
    });
    inputEl.addEventListener("focus", function(){
      if (dropdown.children.length) dropdown.hidden = false;
    });
    document.addEventListener("click", function(e){
      if (e.target === inputEl || dropdown.contains(e.target)) return;
      dropdown.hidden = true;
    });

    function renderMessage(text){
      dropdown.innerHTML = "";
      var msg = document.createElement("div");
      msg.className = "ac-empty";
      msg.textContent = text;
      dropdown.appendChild(msg);
      dropdown.hidden = false;
    }

    function renderDropdown(results){
      dropdown.innerHTML = "";
      results.forEach(function(r){
        var item = document.createElement("div");
        item.className = "ac-item";
        item.appendChild(coverEl(r, 30));
        var info = document.createElement("div");
        info.className = "ac-item-info";
        var t = document.createElement("div"); t.className = "ac-item-title"; t.textContent = r.title;
        var a = document.createElement("div"); a.className = "ac-item-author"; a.textContent = r.author || "Auteur inconnu";
        info.appendChild(t); info.appendChild(a);
        item.appendChild(info);
        item.addEventListener("click", function(){
          onSelect(r);
          dropdown.hidden = true;
        });
        dropdown.appendChild(item);
      });
      dropdown.hidden = false;
    }
  }

  function stopScanner(){
    if (quaggaRunning && typeof Quagga !== "undefined"){
      try { Quagga.offDetected(onBarcodeDetected); Quagga.stop(); } catch(e){}
      quaggaRunning = false;
    }
  }

  function onBarcodeDetected(result){
    var code = normalizeIsbn(result.codeResult.code);
    if (code.length < 12) return;
    lastCodes.push(code);
    if (lastCodes.length > 5) lastCodes.shift();
    var count = lastCodes.filter(function(c){ return c === code; }).length;
    if (count < 2) return; // wait for a stable read
    stopScanner();
    scanHintEl.style.display = "none";
    handleScannedIsbn(code);
  }

  function handleScannedIsbn(isbn){
    var existing = books.find(function(b){ return b.isbn === isbn; });
    if (existing){
      showDuplicateStamp(existing);
      return;
    }
    scanStatusEl.textContent = "Recherche des informations…";
    lookupBook(isbn).then(function(info){
      scanStatusEl.textContent = "";
      showAddCard(isbn, info);
    });
  }

  function showDuplicateStamp(book){
    scanResultEl.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "stamp-wrap";
    wrap.innerHTML = '<div class="stamp">Déjà dans<br>ta bibliothèque</div>';
    var bookRow = document.createElement("div");
    bookRow.className = "stamp-book";
    bookRow.appendChild(coverEl(book, 44));
    var info = document.createElement("div");
    info.innerHTML = '<div class="row-title serif">' + escapeHtml(book.title || "Sans titre") + '</div><div class="row-author">' + escapeHtml(book.author || "") + '</div>';
    bookRow.appendChild(info);
    wrap.appendChild(bookRow);

    var actions = document.createElement("div");
    actions.className = "result-actions";
    var again = document.createElement("button");
    again.className = "btn"; again.textContent = "Scanner un autre";
    again.addEventListener("click", function(){ lastCodes = []; scanResultEl.innerHTML = ""; scanHintEl.style.display = "block"; startScanner(); });
    var close = document.createElement("button");
    close.className = "btn primary"; close.textContent = "Fermer";
    close.addEventListener("click", function(){ scannerOverlay.hidden = true; });
    actions.appendChild(again); actions.appendChild(close);
    wrap.appendChild(actions);

    scanResultEl.appendChild(wrap);
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function showAddCard(isbn, info){
    var found = !!info;
    var title = info ? info.title : "";
    var author = info ? info.author : "";
    var cover = info ? info.cover : "";

    scanResultEl.innerHTML = "";
    var card = document.createElement("div");
    card.className = "result-card";
    var coverPreview = coverEl({title: title, cover: cover}, 60);
    card.appendChild(coverPreview);

    var fields = document.createElement("div");
    fields.className = "result-fields";
    fields.innerHTML =
      (found ? "" : '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:2px;">Livre non trouvé automatiquement — tape le titre pour voir des suggestions.</div>') +
      '<div><span class="field-label">Titre</span><input class="field-input" id="ac-title" value="' + escapeHtml(title) + '"></div>' +
      '<div><span class="field-label">Auteur</span><input class="field-input" id="ac-author" value="' + escapeHtml(author) + '"></div>' +
      '<div class="read-toggle-row"><div class="read-switch" id="ac-read-switch"><button type="button" data-val="unread" class="active">Non lu</button><button type="button" data-val="reading">En cours</button><button type="button" data-val="read">Lu</button></div></div>';
    card.appendChild(fields);
    scanResultEl.appendChild(card);

    attachAutocomplete(document.getElementById("ac-title"), function(r){
      document.getElementById("ac-title").value = r.title;
      document.getElementById("ac-author").value = r.author || "";
      if (r.cover){
        cover = r.cover;
        var newPreview = coverEl({title: r.title, cover: cover}, 60);
        card.replaceChild(newPreview, coverPreview);
        coverPreview = newPreview;
      }
    });

    var readVal = "unread";
    var switchEl = document.getElementById("ac-read-switch");
    switchEl.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        switchEl.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        readVal = btn.getAttribute("data-val");
      });
    });

    var actions = document.createElement("div");
    actions.className = "result-actions";
    var again = document.createElement("button");
    again.className = "btn"; again.textContent = "Annuler";
    again.addEventListener("click", function(){ lastCodes = []; scanResultEl.innerHTML = ""; scanHintEl.style.display = "block"; startScanner(); });
    var save = document.createElement("button");
    save.className = "btn primary"; save.textContent = "Ajouter";
    save.addEventListener("click", function(){
      var newBook = {
        isbn: isbn,
        title: document.getElementById("ac-title").value.trim() || "Sans titre",
        author: document.getElementById("ac-author").value.trim(),
        cover: cover,
        status: readVal,
        loanedTo: "",
        addedAt: Date.now()
      };
      books.push(newBook);
      saveLibrary();
      renderAll();
      showToast("« " + newBook.title + " » ajouté.");
      scannerOverlay.hidden = true;
    });
    actions.appendChild(again); actions.appendChild(save);
    scanResultEl.appendChild(actions);
  }

  // ---------- Manual add / edit overlay ----------
  var manualOverlay = document.getElementById("manual-overlay");

  function resetManualForm(){
    document.getElementById("m-title").value = "";
    document.getElementById("m-author").value = "";
    document.getElementById("m-series").value = "";
    document.getElementById("m-isbn").value = "";
    document.getElementById("m-loan").value = "";
    manualSelectedCover = "";
    pendingManualStatus = "unread";
    document.querySelectorAll("#m-read-switch button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-val") === "unread");
    });
  }

  document.getElementById("open-manual").addEventListener("click", function(){
    editingBook = null;
    resetManualForm();
    document.getElementById("manual-overlay-title").textContent = "Ajouter manuellement";
    document.getElementById("m-save").textContent = "Ajouter à ma bibliothèque";
    manualOverlay.hidden = false;
  });

  function openEditOverlay(book){
    editingBook = book;
    document.getElementById("m-title").value = book.title || "";
    document.getElementById("m-author").value = book.author || "";
    document.getElementById("m-series").value = book.series || "";
    document.getElementById("m-isbn").value = book.isbn || "";
    document.getElementById("m-loan").value = book.loanedTo || "";
    manualSelectedCover = book.cover || "";
    pendingManualStatus = book.status || "unread";
    document.querySelectorAll("#m-read-switch button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-val") === pendingManualStatus);
    });
    document.getElementById("manual-overlay-title").textContent = "Modifier le livre";
    document.getElementById("m-save").textContent = "Enregistrer les modifications";
    manualOverlay.hidden = false;
  }

  document.getElementById("close-manual").addEventListener("click", function(){
    manualOverlay.hidden = true;
    editingBook = null;
  });
  document.querySelectorAll("#m-read-switch button").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll("#m-read-switch button").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      pendingManualStatus = btn.getAttribute("data-val");
    });
  });
  document.getElementById("m-save").addEventListener("click", function(){
    var title = document.getElementById("m-title").value.trim();
    var author = document.getElementById("m-author").value.trim();
    var series = document.getElementById("m-series").value.trim();
    var isbn = normalizeIsbn(document.getElementById("m-isbn").value.trim());
    var loanedTo = document.getElementById("m-loan").value.trim();
    if (!title){ showToast("Ajoute au moins un titre."); return; }

    if (editingBook){
      if (isbn && books.some(function(b){ return b !== editingBook && b.isbn === isbn; })){
        showToast("Un autre livre de ta bibliothèque a déjà cet ISBN.");
        return;
      }
      editingBook.title = title;
      editingBook.author = author;
      editingBook.series = series;
      editingBook.isbn = isbn;
      editingBook.cover = manualSelectedCover;
      editingBook.status = pendingManualStatus;
      editingBook.loanedTo = loanedTo;
      saveLibrary();
      renderAll();
      manualOverlay.hidden = true;
      showToast("« " + title + " » mis à jour.");
      editingBook = null;
      return;
    }

    if (isbn && books.find(function(b){ return b.isbn === isbn; })){
      showToast("Ce livre est déjà dans ta bibliothèque.");
      return;
    }
    books.push({ isbn: isbn, title: title, author: author, series: series, cover: manualSelectedCover, status: pendingManualStatus, loanedTo: loanedTo, addedAt: Date.now() });
    saveLibrary();
    renderAll();
    manualOverlay.hidden = true;
    showToast("« " + title + " » ajouté.");
  });


  attachAutocomplete(document.getElementById("m-title"), function(r){
    document.getElementById("m-title").value = r.title;
    if (r.author) document.getElementById("m-author").value = r.author;
    if (r.isbn) document.getElementById("m-isbn").value = r.isbn;
    manualSelectedCover = r.cover || "";
  });

  // ---------- Export ----------
  document.getElementById("export-btn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(books, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "ma-bibliotheque.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  loadLibrary();
})();
</script>
</body>
</html>
